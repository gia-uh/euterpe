[project]
name = "euterpe"
version = "0.2.0"
description = "Compose music by writing code: synthesis, instruments, tonal theory and a linter."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "the Euterpe authors" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "soundfile>=0.13",
    "pyloudnorm>=0.1.1",
]

[project.scripts]
euterpe = "euterpe.cli:main"

[project.optional-dependencies]
view = ["matplotlib>=3.9"]
notation = ["verovio>=6.3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "matplotlib>=3.9",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "ipykernel>=7.4.0",
    "pytest-xdist>=3.8.0",
    "verovio>=6.3",
    "mido>=1.3",
]  # matplotlib: tests of euterpe.view; verovio: the MusicXML tests load the output; mido: the MIDI tests read the file back
book = [
    "scriptorium @ git+https://github.com/apiad/scriptorium@v0.12.0",
    "matplotlib>=3.9",
    "verovio>=6.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["euterpe"]
