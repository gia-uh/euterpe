# Euterpe, the book. Every code block runs when the book builds, from this
# directory; the sounds and figures it writes land in build/.
theme: book
base-url: https://uhgia.org/euterpe/
# freeze: file caches each chapter's blocks on the whole chapter's text: a teaser
# runs code it reads from its own chapter, and the level check reads every sound so far.
execute: {timeout: 120, freeze: file}

vars:
  title: "Euterpe"
  subtitle: "Music for programmers, from the physics of a wave up"

files:
  - chapters/00-preface.md
  - chapters/01-what-sound-is.md
  - chapters/02-pitch-and-loudness.md
  - chapters/03-timbre.md
  - chapters/04-envelopes.md
  - chapters/05-filters.md
  - chapters/06-fm-noise-wavetables.md
  - chapters/07-physical-models.md
  - chapters/08-effects.md
  - chapters/09-anatomy-of-an-instrument.md
  - chapters/10-plucked-strings.md
  - chapters/11-electric-guitar.md
  - chapters/12-keys-and-synthesizers.md
  - chapters/13-bowed-strings-winds-and-brass.md
  - chapters/14-drums-and-percussion.md
  - chapters/15-chip-sounds.md

outputs:
  site:
    format: docs
    dir: site
    repo-url: https://github.com/gia-uh/euterpe
  print:
    format: pdf
